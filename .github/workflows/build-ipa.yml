name: Fast Build Concord iOS IPA

on:
  push:
    branches: ["main", "codex/**", "concord/signal-foundation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-package:
    name: Build and package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app

    steps:
      - name: Checkout Concord and Signal-iOS
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch Signal-iOS submodules only
        run: git submodule update --init --recursive clients/ios

      - name: Verify Xcode version
        working-directory: clients/ios
        run: Scripts/check_xcode_version.py --relaxed

      - name: Set up Ruby build tools
        uses: ruby/setup-ruby@v1
        with:
          working-directory: clients/ios
          bundler-cache: true

      - name: Fetch official Signal build dependencies
        working-directory: clients/ios
        run: make dependencies

      - name: Build and package IPA
        run: python3 scripts/package_ipa.py --unsigned --configuration Debug

      - name: Verify packaged IPA identity
        run: |
          unzip -t build/Concord.ipa
          unzip -p build/Concord.ipa Payload/Concord.app/Info.plist > /tmp/Concord-Info.plist
          plutil -extract CFBundleIdentifier raw /tmp/Concord-Info.plist | grep -Fx app.concord.ios
          plutil -extract CFBundleDisplayName raw /tmp/Concord-Info.plist | grep -Fx Concord

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Concord-unsigned-IPA
          path: build/Concord.ipa
          retention-days: 30

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Signal-iOS-test-logs
          path: ~/Library/Logs/Signal-CI
          if-no-files-found: ignore
