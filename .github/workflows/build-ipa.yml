name: Build and Test Signal-iOS IPA

on:
  push:
    branches: ["main", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-package:
    name: Build, test, and package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app

    steps:
      - name: Checkout Concord and Signal-iOS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode version
        working-directory: clients/ios
        run: Scripts/check_xcode_version.py --relaxed

      - name: Download required iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Set up Ruby build tools
        uses: ruby/setup-ruby@v1
        with:
          working-directory: clients/ios
          bundler-cache: true

      - name: Fetch official Signal build dependencies
        working-directory: clients/ios
        run: make dependencies

      - name: Build and run Signal-iOS tests
        working-directory: clients/ios
        run: bundle exec zsh Scripts/build-and-test.sh

      - name: Package the tested device build
        run: python3 scripts/package_ipa.py --unsigned

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Concord-unsigned-IPA
          path: build/Concord.ipa
          retention-days: 30

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Signal-iOS-test-logs
          path: ~/Library/Logs/Signal-CI
          if-no-files-found: ignore
