name: Fast Build Unsigned Concord IPA for Sideloading

on:
  push:
    branches: [ "concord/signal-foundation", "main", "master" ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Fast Build Concord.ipa (Unsigned Sideload)
    runs-on: macos-14

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Unsigned Concord.ipa
        run: |
          python scripts/package_ipa.py

      - name: Upload Concord.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Concord-Unsigned-IPA
          path: Concord.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/concord/signal-foundation'
        with:
          files: Concord.ipa
          tag_name: concord-ipa-latest
          name: Concord Unsigned iOS Release (Sideload Ready)
          body: |
            ## Concord Unsigned IPA for Sideloading
            - **Bundle Identifier**: `app.concord.ios` (Pinned)
            - **APNs**: Disabled for local LAN sideloading.
            - **Default LAN PC Target**: `http://192.168.1.4:8080`
            - **Sideload Support**: AltStore, Sideloadly, TrollStore, Scarlet, Esign.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
