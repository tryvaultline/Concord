services:
  concord-auth:
    build:
      context: ../../services/concord-auth
      dockerfile: Dockerfile
    container_name: concord-auth
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CONCORD_AUTH_PORT: "8080"
      CONCORD_AUTH_BIND_HOST: 0.0.0.0
      CONCORD_ENV: development
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: concord-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: concord-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${CONCORD_STORAGE_ACCESS_KEY:?Set CONCORD_STORAGE_ACCESS_KEY in .env.local}
      MINIO_ROOT_PASSWORD: ${CONCORD_STORAGE_SECRET_KEY:?Set CONCORD_STORAGE_SECRET_KEY in .env.local}
    command: server /data --console-address ":9001"
    restart: unless-stopped

networks:
  default:
    name: concord-network
