version: '3.8'

services:
  concord-auth:
    build:
      context: ../../services/concord-auth
      dockerfile: Dockerfile
    container_name: concord-auth
    ports:
      - "8080:8080"
    environment:
      - CONCORD_AUTH_PORT=8080
      - CONCORD_ENV=development
      - CONCORD_REDIS_HOST=redis
      - CONCORD_REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: concord-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: concord-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: concord_admin
      MINIO_ROOT_PASSWORD: concord_storage_dev_secret
    command: server /data --console-address ":9001"
    restart: unless-stopped

networks:
  default:
    name: concord-network
